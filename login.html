<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - CSUN Club Portal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="csun-badge">CSUN</span>
            <span class="portal-title">Club Portal</span>
        </a>
        <nav class="nav-links">
            <a href="discover.html">Discover clubs</a>
            <a href="my-clubs.html">My clubs</a>
            <a href="events.html">Events</a>
            <a href="help.html">Help</a>
            <a href="login.html" class="login-nav-btn active">Log in</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-header">
                    <h2>Log in</h2>
                    <p>Use your CSUN account to join clubs, RSVP to events and follow your registrations.</p>
                </div>
                <button class="sso-btn" onclick="window.location.href='my-clubs.html'">Continue with CSUN single sign-on</button>
                <div class="divider">or</div>
                <form onsubmit="event.preventDefault(); window.location.href='my-clubs.html';">
                    <div class="form-group">
                        <label>CSUN email</label>
                        <input type="email" placeholder="name@my.csun.edu" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="register-club-btn full-width">Log in</button>
                </form>
                <p class="login-footer-links">New here? <a href="help.html">Register a club</a> · <a href="help.html">Need help?</a></p>
            </div>
        </div>
    </main>
</body>
</html>
