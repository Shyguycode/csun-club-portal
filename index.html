<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSUN Club Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="csun-badge">CSUN</span>
            <span class="portal-title">Club Portal</span>
        </a>
        <nav class="nav-links">
            <a href="discover.html">Discover clubs</a>
            <a href="my-clubs.html">My clubs</a>
            <a href="events.html">Events</a>
            <a href="help.html">Help</a>
            <a href="login.html" class="login-nav-btn">Log in</a>
        </nav>
    </header>

    <main class="main-container">
        <section class="hero-section">
            <div class="hero-content">
                <h1>Find your community</h1>
                <p class="hero-subtitle">Join a club or start one at CSUN.</p>
                <div class="search-bar-wrapper">
                    <input type="text" id="clubSearch" placeholder="Search clubs..." autocomplete="off">
                </div>
            </div>
            <div class="cta-wrapper">
                <a href="login.html" class="register-club-btn">Register new club</a>
            </div>
        </section>

        <section class="clubs-grid">
            <div class="club-card">
                <span class="card-tag">Academic</span>
                <h2>Robotics Club</h2>
                <p class="card-desc">Build nights and competitions.</p>
                <a href="robotics.html" class="view-club-link">View club</a>
            </div>
            <div class="club-card">
                <span class="card-tag">Academic</span>
                <h2>Cyber Defense Club</h2>
                <p class="card-desc">Capture-the-flag teams and security workshops.</p>
                <a href="cyber.html" class="view-club-link">View club</a>
            </div>
        </section>
    </main>
</body>
</html>
